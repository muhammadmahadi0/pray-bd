<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pray BD - Modern Prayer Times</title>
        <meta
            name="description"
            content="Accurate prayer times for Bangladesh with countdown and Hijri date"
        />
        <meta name="theme-color" content="#000000" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap"
            rel="stylesheet"
        />

        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>

        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            emerald: {
                                950: "#022c22",
                                900: "#064e3b",
                                800: "#065f46",
                                700: "#047857",
                            },
                            gold: {
                                400: "#d4af37",
                                500: "#c9a227",
                                600: "#b8911f",
                            },
                            cream: {
                                50: "#fdfbf7",
                                100: "#f7f3e8",
                                200: "#ede4d0",
                            },
                        },
                        fontFamily: {
                            sans: ["Inter", "Noto Sans Bengali", "sans-serif"],
                            arabic: ["Amiri", "serif"],
                        },
                        animation: { "fade-in": "fadeIn 0.5s ease-out" },
                        keyframes: {
                            fadeIn: {
                                "0%": {
                                    opacity: "0",
                                    transform: "translateY(10px)",
                                },
                                "100%": {
                                    opacity: "1",
                                    transform: "translateY(0)",
                                },
                            },
                        },
                    },
                },
            };
        </script>

        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="islamic-pattern">
        <div id="app">
            <header class="sticky top-0 z-40 glass-card">
                <div
                    class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between"
                >
                    <div class="flex items-center gap-2">
                        <i
                            data-lucide="mosque"
                            class="w-6 h-6 text-gold-400"
                        ></i>
                        <h1 class="text-xl font-semibold text-gold-400">
                            Pray BD
                        </h1>
                    </div>
                    <div class="flex items-center gap-2">
                        <button
                            id="langToggle"
                            class="p-2 rounded-lg hover:bg-white/10 transition-colors"
                            title="Toggle Language"
                        >
                            <i data-lucide="globe" class="w-5 h-5"></i>
                        </button>
                        <button
                            id="themeToggle"
                            class="p-2 rounded-lg hover:bg-white/10 transition-colors"
                            title="Toggle Theme"
                        >
                            <i
                                data-lucide="moon"
                                class="w-5 h-5 dark:hidden"
                            ></i>
                            <i
                                data-lucide="sun"
                                class="w-5 h-5 hidden dark:block"
                            ></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Hero Section - Countdown -->
            <section class="max-w-4xl mx-auto px-4 py-6 md:py-8">
                <div
                    class="glass-card rounded-2xl p-4 md:p-8 text-center animate-fade-in hero-section"
                >
                    <p
                        id="nextPrayerLabel"
                        class="text-gold-400 font-medium mb-2 text-lg"
                    >
                        Loading...
                    </p>
                    <div
                        id="countdown"
                        class="countdown-timer font-bold text-4xl md:text-6xl lg:text-7xl text-gold-400 mb-2 countdown-pulse font-mono"
                    >
                        --:--:--
                    </div>
                    <div
                        class="flex flex-wrap items-center justify-center gap-2 md:gap-4 text-sm"
                    >
                        <span id="currentTime" class="text-cream-200"></span>
                        <span class="text-gold-400/50 hidden md:inline">•</span>
                        <span
                            id="lastUpdated"
                            class="text-cream-200/70 hidden md:inline"
                        ></span>
                    </div>
                </div>
            </section>

            <!-- Error Message -->
            <section
                id="errorSection"
                class="max-w-4xl mx-auto px-4 pb-4 hidden"
            >
                <div
                    class="glass-card rounded-xl p-4 bg-red-900/30 border-red-500/50"
                >
                    <div class="flex items-center gap-3">
                        <i
                            data-lucide="alert-triangle"
                            class="w-5 h-5 text-red-400"
                        ></i>
                        <p id="errorMessage" class="text-sm text-red-200"></p>
                    </div>
                </div>
            </section>

            <!-- Date Display -->
            <section class="max-w-4xl mx-auto px-4 pb-6">
                <div
                    class="glass-card rounded-xl p-3 md:p-4 flex flex-wrap items-center justify-center gap-3 md:gap-6"
                >
                    <div class="flex items-center gap-2">
                        <i
                            data-lucide="calendar-days"
                            class="w-5 h-5 text-gold-400"
                        ></i>
                        <span id="gregorianDate" class="text-sm"
                            >Loading...</span
                        >
                    </div>
                    <div class="w-px h-6 bg-gold-400/30 hidden md:block"></div>
                    <div class="flex items-center gap-2">
                        <i
                            data-lucide="calendar"
                            class="w-5 h-5 text-gold-400"
                        ></i>
                        <span id="hijriDate" class="text-sm">Loading...</span>
                    </div>
                    <div class="w-px h-6 bg-gold-400/30 hidden md:block"></div>
                    <!-- Auto-detected Location Display -->
                    <div class="flex items-center gap-2 flex-wrap justify-center">
                        <i data-lucide="map-pin" class="w-4 h-4 text-gold-400"></i>
                        <span id="detectedLocation" class="text-sm font-medium text-emerald-300"></span>
                        <span id="autoBadge" class="text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-800 text-emerald-300 border border-emerald-700/50">Auto-detected</span>
                    </div>
                </div>
            </section>

            <!-- Prayer Times Grid -->
            <section class="max-w-4xl mx-auto px-4 pb-8">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i data-lucide="clock" class="w-5 h-5 text-gold-400"></i>
                    <span id="prayerTimesTitle">নামাজের সময়</span>
                </h2>
                <div
                    id="prayerGrid"
                    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3"
                ></div>
            </section>

            <!-- Footer -->
            <footer class="max-w-4xl mx-auto px-4 pb-8">
                <div class="glass-card rounded-xl p-4 text-center">
                    <p class="text-sm text-cream-200">
                        <span id="footerText">আল্লাহ্ই আমাদের জন্য যথেষ্ট</span>
                    </p>
                    <p class="text-xs text-gold-400/60 mt-2" id="apiCredit">
                        Prayer times powered by Aladhan API • Optimized for
                        Bangladesh
                    </p>
                    <p id="ipDisplay" class="text-xs text-gold-400/40 mt-2 font-mono"></p>
                </div>
            </footer>
        </div>

        <script src="script.js"></script>
    </body>
</html>
